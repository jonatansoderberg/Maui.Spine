name: Release

# A release is started by hand (Actions → Release → Run workflow, or `gh workflow run release.yml`) and gets
# its version from the commit: VersionMajor.yyMMdd.revision, the major from src/Directory.Build.props, the
# date of the run (UTC) and the commit count of master, 0.261031.812 (docs/wiki/versioning.md). The workflow
# tags the commit v<version> itself. A pushed tag still releases its own version, so a prerelease is a tag
# with a suffix (v0.261031.812-preview.1).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Publishing uses nuget.org's Trusted Publishing: the NuGet/login step trades this job's OIDC token
# for a short-lived API key, under the policy registered on nuget.org for this repository and this
# workflow file. No stored key.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    # By hand from master only; a tag from anywhere.
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/master'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # The whole history: the revision is the commit count.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet workload install maui

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            case "$VERSION" in *-*) echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV";; esac
          else
            MAJOR=$(sed -n 's:.*<VersionMajor>\(.*\)</VersionMajor>.*:\1:p' src/Directory.Build.props)
            VERSION="$MAJOR.$(date -u +%y%m%d).$(git rev-list --count HEAD)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "Version $VERSION"

      - run: dotnet restore Spine.Packages.slnf

      - run: dotnet build Spine.Packages.slnf -c Release --no-restore -p:Version="$VERSION"

      - run: dotnet test tests/Plugin.Maui.Spine.Server.Tests -c Release --no-build

      - run: dotnet pack Spine.Packages.slnf -c Release --no-build -p:Version="$VERSION"

      - run: python .github/workflows/list-packages.py artifacts/packages

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: CosmoMedia

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        # One file at a time: NuGet on Windows does not expand a wildcard in a forward-slash path.
        # The matching .snupkg beside each package goes with it.
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Creates the tag at this commit when the run was started by hand.
        run: gh release create "$TAG" artifacts/packages/*.nupkg --target "$GITHUB_SHA" --title "$TAG" --generate-notes $PRERELEASE
