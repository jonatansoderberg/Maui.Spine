name: Release

# A release is a tag: `git tag v0.1.0 && git push origin v0.1.0`. The version is the tag without
# its v; a tag with a prerelease suffix (v0.2.0-preview.1) publishes a prerelease.
on:
  push:
    tags: ['v*']

# Publishing uses nuget.org's Trusted Publishing: the NuGet/login step trades this job's OIDC token
# for a short-lived API key, under the policy registered on nuget.org for this repository and this
# workflow file. No stored key.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet workload install maui

      - name: Version from tag
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          case "$GITHUB_REF_NAME" in *-*) echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV";; esac

      - run: dotnet restore Spine.Packages.slnf

      - run: dotnet build Spine.Packages.slnf -c Release --no-restore -p:Version="$VERSION"

      - run: dotnet test tests/Plugin.Maui.Spine.Server.Tests -c Release --no-build

      - run: dotnet pack Spine.Packages.slnf -c Release --no-build -p:Version="$VERSION"

      - run: python .github/workflows/list-packages.py artifacts/packages

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: CosmoMedia

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        # One file at a time: NuGet on Windows does not expand a wildcard in a forward-slash path.
        # The matching .snupkg beside each package goes with it.
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/packages/*.nupkg --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE
